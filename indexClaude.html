<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abriendo Claude…</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1f1e1d; color:#eee; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; box-sizing:border-box; }
  .box { text-align:center; max-width:420px; }
  a.btn { display:inline-block; margin-top:16px; padding:12px 20px; background:#d97757; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
  a.web { display:block; margin-top:14px; color:#aaa; font-size:14px; }
  .err { color:#f88; }
</style>
</head>
<body>
<div class="box" id="box">
  <p>Abriendo el chat en la app de Claude…</p>
</div>
<script>
  // Uso: https://TU-USUARIO.github.io/abrir-claude/?chat=ID-DEL-CHAT
  var id = new URLSearchParams(location.search).get("chat") || "";
  var box = document.getElementById("box");
  // Solo acepta IDs con formato de chat de Claude (UUID), por seguridad
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
    var app = "claude://claude.ai/chat/" + id;
    var web = "https://claude.ai/chat/" + id;
    box.innerHTML =
      '<p>Abriendo el chat en la app de Claude…</p>' +
      '<a class="btn" href="' + app + '">Abrir en la app</a>' +
      '<a class="web" href="' + web + '">o abrir en el navegador</a>';
    location.href = app;
  } else {
    box.innerHTML = '<p class="err">Falta el ID del chat o no es válido.</p>';
  }
</script>
</body>
</html>
